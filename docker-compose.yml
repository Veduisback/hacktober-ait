version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# AI Hospital Supply-Chain Disruption Analyst
# Docker Compose – brings up Streamlit UI + FastAPI + Ollama
#
# Usage:
#   docker compose up --build          # start all services
#   docker compose up streamlit        # UI only
#   docker compose run --rm app python seed.py  # seed the DB
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama (LLM server) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: hospital_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Model puller (runs once, then exits) ──────────────────────────────────
  model_puller:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: >
      sh -c "
        ollama pull qwen2.5:7b &&
        ollama pull nomic-embed-text &&
        echo 'Models ready.'
      "
    restart: "no"

  # ── Seeder (runs once, then exits) ────────────────────────────────────────
  seeder:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - app_data:/app/data
    command: python seed.py
    restart: "no"

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  streamlit:
    build: .
    container_name: hospital_streamlit
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - app_data:/app/data
    ports:
      - "8501:8501"
    command: >
      streamlit run app.py
        --server.port=8501
        --server.address=0.0.0.0
        --server.headless=true
    restart: unless-stopped

  # ── FastAPI REST layer ────────────────────────────────────────────────────
  api:
    build: .
    container_name: hospital_api
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  ollama_data:
  app_data:
